<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <rect width="108" height="108" rx="24" fill="#0d1117"/>
  <!-- Speech bubble and its lively tail -->
  <path d="M59 48c6 5 13 6 20 6-5-3-8-7-10-11z" fill="#d8e2eb"/>
  <ellipse cx="54" cy="29" rx="29" ry="25" fill="#d8e2eb"/>
  <!-- M: --, C: -.-., G: --. -->
  <g fill="#304255">
    <rect x="40" y="18" width="12" height="4" rx="2"/><rect x="57" y="18" width="12" height="4" rx="2"/>
    <rect x="33" y="28" width="10" height="4" rx="2"/><circle cx="50" cy="30" r="2.5"/><rect x="57" y="28" width="10" height="4" rx="2"/><circle cx="74" cy="30" r="2.5"/>
    <rect x="38" y="38" width="10" height="4" rx="2"/><rect x="53" y="38" width="10" height="4" rx="2"/><circle cx="70" cy="40" r="2.5"/>
  </g>
  <!-- Base -->
  <path d="M12 91q0-5 5-5h74q5 0 5 5v7H12z" fill="#33475b"/>
  <path d="M17 89h74v5H17z" fill="#101923"/>
  <path d="M21 90h66v2H21z" fill="#a6b6c5"/>
  <!-- Main key body -->
  <path d="M12 67h84v16q0 3-3 3H15q-3 0-3-3z" fill="#5d7388"/>
  <path d="M16 72h76v10H16z" fill="#25384a"/>
  <path d="M16 69h76v3H16z" fill="#94a9ba"/>
  <!-- Left paddle and handle -->
  <path d="M14 62h16l-2 10H17z" fill="#6f8498"/>
  <rect x="9" y="58" width="26" height="7" rx="2" fill="#b98b13"/>
  <rect x="12" y="60" width="20" height="2" rx="1" fill="#f2c94c"/>
  <!-- Horizontal lever, pivot and contact -->
  <path d="M27 68h56" stroke="#c8d6e2" stroke-width="4" stroke-linecap="round"/>
  <path d="M48 65h12v20H48z" fill="#71879b"/>
  <circle cx="54" cy="69" r="5.5" fill="#1b2a39" stroke="#b8c9d8" stroke-width="2"/>
  <circle cx="54" cy="69" r="1.5" fill="#e4eef6"/>
  <path d="M72 78v8m8-8v8" stroke="#b4c4d1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="76" cy="78" r="3" fill="#58a6ff"/>
  <!-- Right adjustment screw -->
  <path d="M84 59v10" stroke="#b4c4d1" stroke-width="3" stroke-linecap="round"/>
  <rect x="78" y="56" width="19" height="5" rx="2.5" fill="#b4c4d1"/>
  <rect x="82" y="61" width="5" height="5" rx="1" fill="#71879b"/>
</svg>
